    const GEMINI_MODEL = "gemini-3-flash-preview";

    // Инициализация состояния из localStorage
    const defaultState = {
      cegly: 12,
      history: [], // { id, date, type, title, score, maxScore, userText, feedback }
      masteredCards: []
    };

    let appState = (() => {
      try {
        const saved = localStorage.getItem('brama_b1_pro_state');
        return saved ? { ...defaultState, ...JSON.parse(saved) } : defaultState;
      } catch (e) {
        return defaultState;
      }
    })();

    function saveState() {
      try {
        localStorage.setItem('brama_b1_pro_state', JSON.stringify(appState));
        updateHeaderStats();
      } catch (e) {
        console.warn('Не удалось сохранить прогресс в localStorage');
      }
    }

    function updateHeaderStats() {
      const el = document.getElementById('header-cegly');
      if (el) el.textContent = appState.cegly;
    }

    // Всплывающие уведомления
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        info: 'bg-gray-900 text-white',
        success: 'bg-emerald-600 text-white',
        warning: 'bg-amber-600 text-white',
        error: 'bg-rose-600 text-white'
      };
      toast.className = `${colors[type] || colors.info} px-4 py-3 rounded-2xl shadow-lg text-sm font-medium flex items-center justify-between transition-all duration-300 opacity-0 translate-y-[-8px]`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-[-8px]');
      });
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-8px]');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    // Вызов Gemini API с экспоненциальным откатом (exponential backoff)
    async function callGeminiAPI(userPrompt, systemInstruction, jsonSchema = null) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ parts: [{ text: userPrompt }] }],
        systemInstruction: { parts: [{ text: systemInstruction }] }
      };

      if (jsonSchema) {
        payload.generationConfig = {
          responseMimeType: "application/json",
          responseSchema: jsonSchema
        };
      }

      const delays = [1000, 2000, 4000, 8000];
      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const result = await response.json();
          const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!text) throw new Error("Пустой ответ от модели");

          return jsonSchema ? JSON.parse(text) : text;
        } catch (err) {
          if (attempt === delays.length) {
            throw err;
          }
          await new Promise(res => setTimeout(res, delays[attempt]));
        }
      }
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;
      const rec = new SpeechRecognition();
      rec.lang = 'pl-PL';
      rec.interimResults = true;
      rec.continuous = true;
      return rec;
    }

    function toggleVoiceInput(textareaId, btnId) {
      const textarea = document.getElementById(textareaId);
      const btn = document.getElementById(btnId);
      if (!textarea) return;

      if (isRecording) {
        stopVoiceInput();
        return;
      }

      recognition = initSpeechRecognition();
      if (!recognition) {
        showToast('Голосовой ввод не поддерживается этим браузером. Используй микрофон на клавиатуре телефона или ввод текста.', 'warning');
        return;
      }

      isRecording = true;
      activeTargetTextareaId = textareaId;
      const initialText = textarea.value.trim();
      let finalTranscript = initialText ? initialText + ' ' : '';

      if (btn) {
        btn.classList.add('bg-rose-600', 'text-white', 'recording-pulse');
        btn.classList.remove('bg-brama-100', 'text-brama-700');
        btn.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-white"></span> Говорите по-польски... (Стоп)`;
      }

      // Автозапуск таймера если это задание на говорение
      if (!isTimerRunning && (textareaId === 'photo-answer' || textareaId === 'mono-answer')) {
        startTimer();
      }

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript + ' ';
          } else {
            interim += transcript;
          }
        }
        textarea.value = (finalTranscript + interim).trim();
        textarea.dispatchEvent(new Event('input'));
      };

      recognition.onerror = (event) => {
        stopVoiceInput();
        if (event.error === 'not-allowed') {
          showToast('Доступ к микрофону запрещен в настройках браузера.', 'error');
        } else {
          showToast('Запись остановлена. Можно продолжить текстом или нажать микрофон снова.', 'info');
        }
      };

      recognition.onend = () => {
        if (isRecording) {
          stopVoiceInput();
        }
      };

      try {
        recognition.start();
      } catch (e) {
        stopVoiceInput();
      }
    }

    function stopVoiceInput() {
      isRecording = false;
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
      render();
    }

      if (!('speechSynthesis' in window)) {
        showToast('Озвучка не поддерживается в этом браузере', 'warning');

      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'pl-PL';
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

      const m = String(Math.floor(sec / 60)).padStart(2, '0');

      return `${m}:${s}`;
    }

              ${res.strengths.map(s => `<li class="flex items-start gap-2"><span class="text-emerald-500 font-bold">✓</span><span>${escapeHtml(s)}</span></li>`).join('')}

    // =========================================================================
    // 5. РОЛЕВЫЕ ДИАЛОГИ (РАЗДЕЛ «ПРАКТИКА / ROZMOWY»)
    // =========================================================================

    function startRoleplay(scenarioId) {
      const scenario = ROLEPLAY_SCENARIOS.find(s => s.id === scenarioId);
      if (!scenario) return;
      activeRoleplay = scenario;
      roleplayMessages = [
        { sender: 'ai', text: scenario.openingLine }
      ];
      render();
      speakPolish(scenario.openingLine);
    }

    function exitRoleplay() {
      if (isRecording) stopVoiceInput();
      window.speechSynthesis?.cancel();
      activeRoleplay = null;
      roleplayMessages = [];
      render();
    }

    function insertPhraseToChat(phrase) {
      const input = document.getElementById('chat-input');
      if (!input) return;
      input.value = input.value ? `${input.value.trim()} ${phrase}` : phrase;
      input.focus();
    }

    async function sendRoleplayMessage() {
      const input = document.getElementById('chat-input');
      if (!input || isRoleplayLoading) return;
      const text = input.value.trim();
      if (!text) return;

      if (isRecording) stopVoiceInput();

      roleplayMessages.push({ sender: 'user', text });
      input.value = '';
      isRoleplayLoading = true;
      render();

      const chatBox = document.getElementById('chat-messages');
      if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;

      const historyText = roleplayMessages
        .map(m => `${m.sender === 'ai' ? 'Собеседник' : 'Студент'}: ${m.text}`)
        .join('\n');

      const systemPrompt = `Ты играешь роль в экзаменационном диалоге по польскому языку на уровень B1.
Твоя роль: ${activeRoleplay.aiRole}
Задача студента в этом диалоге: ${activeRoleplay.userGoal}
Правила:
1. Отвечай ТОЛЬКО на живом, естественном польском языке (2-4 предложения), поддерживая реалистичный разговор.
2. Задавай встречный вопрос или предлагай деталь, чтобы студент мог продолжить диалог.
3. Не выходи из роли и не пиши переводы на русский внутри реплики.`;

      try {
        const reply = await callGeminiAPI(`История диалога:\n${historyText}\n\nОтветь следующей репликой собеседника на польском:`, systemPrompt);
        roleplayMessages.push({ sender: 'ai', text: reply.trim() });
        isRoleplayLoading = false;
        render();
        speakPolish(reply.trim());
        const updatedBox = document.getElementById('chat-messages');
        if (updatedBox) updatedBox.scrollTop = updatedBox.scrollHeight;
      } catch (e) {
        isRoleplayLoading = false;
        showToast('Ошибка связи. Попробуй отправить сообщение еще раз.', 'error');
        render();
      }
    }

    async function finishAndGradeRoleplay() {
      const userTurns = roleplayMessages.filter(m => m.sender === 'user');
      if (userTurns.length < 2) {
        showToast('Сделай хотя бы 2–3 реплики в диалоге перед оценкой!', 'warning');
        return;
      }

      const fullDialogue = roleplayMessages
        .map(m => `${m.sender === 'ai' ? 'Экзаменатор' : 'Кандидат'}: ${m.text}`)
        .join('\n');

      await evaluateExamTask(
        'Диалог (Rozmowa B1)',
        activeRoleplay.title,
        `Роль: ${activeRoleplay.aiRole}. Задача: ${activeRoleplay.userGoal}`,
        fullDialogue,
        'roleplay-eval-result'
      );
    }

    // =========================================================================
    // 6. РЕНДЕРИНГ ВКЛАДОК ИНТЕРФЕЙСА
    // =========================================================================

    function switchTab(tab) {
      if (isRecording) stopVoiceInput();
      currentTab = tab;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchExamSubTab(sub) {
      if (isRecording) stopVoiceInput();
      resetTimer();
      examSubTab = sub;
      render();
    }

    function render() {
      updateHeaderStats();

      // Подсветка нижней навигации
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.id === `nav-${currentTab}`;
        const wrap = btn.querySelector('.nav-icon-wrap');
        if (isActive) {
          btn.classList.add('text-brama-600');
          btn.classList.remove('text-gray-500');
          wrap.classList.add('bg-brama-100', 'text-brama-600');
        } else {
          btn.classList.remove('text-brama-600');
          btn.classList.add('text-gray-500');
          wrap.classList.remove('bg-brama-100', 'text-brama-600');
        }
      });

      const app = document.getElementById('app-content');
      if (currentTab === 'exams') {
        app.innerHTML = renderExamsTab();
        if (examSubTab === 'writing') updateWordCounter();
      } else if (currentTab === 'practice') {
        app.innerHTML = renderPracticeTab();
      } else if (currentTab === 'vocab') {
        app.innerHTML = renderVocabTab();
      } else if (currentTab === 'progress') {
        app.innerHTML = renderProgressTab();
      }
    }

    // --- ВКЛАДКА 1: ЭКЗАМЕНЫ (Фото, Монолог, Письмо ~150 слов) ---

              <div>

      }

      if (examSubTab === 'monologue') {

        return `

            ${subTabsHtml}

              <div>
                <span class="text-[11px] font-bold uppercase tracking-wider text-brama-600">Экзаменационная карточка</span>

              </div>

              <div class="bg-amber-50/70 border border-amber-200/70 rounded-2xl p-3.5 space-y-1.5">

          <div class="bg-white rounded-3xl p-4 card-shadow border border-purple-100 space-y-3.5">

            </button>
          </div>

          <div id="writing-eval-result"></div>
        </div>
      `;
    }

    function appendWord(textareaId, word) {
      const el = document.getElementById(textareaId);
      if (!el) return;
      const cur = el.value.trim();
      el.value = cur ? `${cur} ${word} ` : `${word} `;
      el.focus();
    }

    function updateWordCounter() {
      const textarea = document.getElementById('writing-answer');
      const badge = document.getElementById('word-count-badge');
      const bar = document.getElementById('word-count-bar');
      if (!textarea || !badge || !bar) return;

      const words = textarea.value.trim().split(/\s+/).filter(Boolean);
      const count = words.length;
      const pct = Math.min(100, Math.round((count / 150) * 100));

      bar.style.width = `${pct}%`;

      if (count >= 135 && count <= 185) {
        badge.textContent = `${count} / 150 слов (Идеальный объем!)`;
        badge.className = 'font-extrabold text-emerald-600';
        bar.className = 'h-full bg-emerald-500 transition-all duration-300';
      } else if (count > 185) {
        badge.textContent = `${count} / 150 слов (Чуть длиннее нормы)`;
        badge.className = 'font-extrabold text-brama-600';
        bar.className = 'h-full bg-brama-600 transition-all duration-300';
      } else {
        badge.textContent = `${count} / 150 слов`;
        badge.className = 'font-extrabold text-amber-600';
        bar.className = 'h-full bg-amber-500 transition-all duration-300';
      }
    }

    // --- ВКЛАДКА 2: ПРАКТИКА (ROZMOWY / РОЛЕВЫЕ ДИАЛОГИ БЕЗ ЗАМКОВ) ---

            <!-- Поле ввода сообщения -->
            <div class="flex items-center gap-2 bg-white p-2 rounded-3xl card-shadow border border-purple-100">
              <button id="chat-mic-btn" onclick="toggleVoiceInput('chat-input', 'chat-mic-btn')" class="w-11 h-11 rounded-2xl bg-brama-100 text-brama-700 flex items-center justify-center flex-shrink-0 font-bold" title="Голосовой ввод">
                🎙️
              </button>
              <input id="chat-input" type="text" onkeydown="if(event.key==='Enter') sendRoleplayMessage()" placeholder="Ответь по-польски..." class="flex-1 text-sm outline-none px-2 text-gray-800" />
              <button onclick="sendRoleplayMessage()" class="px-4 h-11 rounded-2xl bg-brama-600 hover:bg-brama-700 text-white font-bold text-xs flex-shrink-0 transition">
                Отправить
              </button>
            </div>

            <div id="roleplay-eval-result"></div>
          </div>
        `;
      }

      return `
        <div class="space-y-4">
          <div>
            <h1 class="text-2xl font-extrabold text-gray-900">Rozmowy</h1>
            <p class="text-xs text-gray-500 mt-0.5">Ролевые диалоги для экзамена B1 • <span class="text-emerald-600 font-bold">Все сценарии открыты 24/7</span></p>
          </div>

          <!-- Главная карточка как в Brama App (но полностью разблокированная!) -->
          <div class="bg-gradient-to-br from-brama-600 to-brama-500 rounded-3xl p-5 text-white shadow-md relative overflow-hidden">
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-2xl bg-white/95 flex items-center justify-center text-2xl shadow-sm flex-shrink-0">
                  ⛷️
                </div>
                <div>
                  <span class="text-[10px] font-bold uppercase tracking-wider text-purple-200">Рекомендуемый сценарий B1</span>
                  <h2 class="text-lg font-extrabold leading-tight mt-0.5">Лыжи в Закопане</h2>
                  <div class="flex items-center gap-1.5 mt-2">
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/20">Państwowy B1</span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-400/30 text-emerald-100">Без лимита</span>
                  </div>
                </div>
              </div>
              <span class="text-xl bg-white/15 p-2 rounded-2xl">🔓</span>
            </div>
            <button onclick="startRoleplay('zakopane_ski')" class="mt-4 w-full py-3 rounded-2xl bg-white text-brama-700 font-extrabold text-xs hover:bg-purple-50 transition shadow-sm">
              Начать разговор прямо сейчас →
            </button>
          </div>

          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2.5">Все категории (открыты без подписки)</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${ROLEPLAY_SCENARIOS.map(sc => `
                <div onclick="startRoleplay('${sc.id}')" class="bg-white hover:border-brama-400 cursor-pointer rounded-3xl p-4 card-shadow border border-gray-100 transition flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between mb-2.5">
                      <div class="w-10 h-10 rounded-2xl bg-brama-50 flex items-center justify-center text-xl">
                        ${sc.icon}
                      </div>
                      <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800">${sc.badge}</span>
                    </div>
                    <h4 class="font-bold text-gray-900 text-sm">${sc.title}</h4>
                    <p class="text-xs text-gray-500 mt-1 line-clamp-2">${sc.category}</p>
                  </div>
                  <div class="mt-3 pt-2.5 border-t border-gray-100 flex items-center justify-between text-xs font-bold text-brama-600">
                    <span>Открыть диалог</span>
                    <span>→</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // --- ВКЛАДКА 3: СЛОВАРЬ (АНТИ-КАЛЬКА И СВЯЗКИ B1) ---
    function toggleMasteredCard(cardId) {
      const idx = appState.masteredCards.indexOf(cardId);
      if (idx === -1) {
        appState.masteredCards.push(cardId);
        appState.cegly += 1;
        showToast('Карточка выучена! +1 cegła 🧱', 'success');
      } else {
        appState.masteredCards.splice(idx, 1);
      }
      saveState();
      render();
    }

    function renderVocabTab() {
      const masteredCount = appState.masteredCards.length;
      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-xl font-extrabold text-gray-900">Словарь ловушек B1</h1>
              <p class="text-xs text-gray-500">Замена калек и готовые связки для экзамена</p>
            </div>
            <span class="text-xs font-bold bg-brama-100 text-brama-700 px-3 py-1 rounded-full">
              ${masteredCount} / ${VOCAB_CARDS.length}
            </span>
          </div>

          <div class="space-y-3">
            ${VOCAB_CARDS.map(card => {
              const isDone = appState.masteredCards.includes(card.id);
              return `
                <div class="bg-white rounded-3xl p-4 card-shadow border ${isDone ? 'border-emerald-200 bg-emerald-50/20' : 'border-purple-100'} space-y-2.5">
                  <div class="flex items-center justify-between">
                    <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full ${card.tag.includes('ловушка') ? 'bg-rose-100 text-rose-700' : 'bg-brama-100 text-brama-700'}">
                      ${card.tag}
                    </span>
                    <button onclick="speakPolish(\`${escapeJs(card.right)}\`)" class="text-xs font-semibold text-brama-600 hover:bg-brama-50 px-2.5 py-1 rounded-xl">
                      🔊 Слушать
                    </button>
                  </div>

                  <div class="space-y-1">
                    <p class="text-xs text-rose-500 line-through">✗ ${card.wrong}</p>
                    <p class="text-base font-extrabold text-emerald-700">✓ ${card.right}</p>
                  </div>

                  <p class="text-xs text-gray-600 leading-relaxed">${card.explanation}</p>

                  <div class="bg-gray-50 rounded-2xl p-2.5 text-xs text-gray-800 italic border border-gray-100 flex items-center justify-between gap-2">
                    <span>«${card.example}»</span>
                    <button onclick="speakPolish(\`${escapeJs(card.example)}\`)" class="text-brama-600 font-bold flex-shrink-0">🔊</button>
                  </div>

                  <button onclick="toggleMasteredCard('${card.id}')" class="w-full py-2 rounded-2xl text-xs font-bold transition ${isDone ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 hover:bg-brama-100 text-gray-700 hover:text-brama-700'}">
                    ${isDone ? '✓ Запомнил (+1 cegła получена)' : 'Отметить как выученное (+1 🧱)'}
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // --- ВКЛАДКА 4: ПРОГРЕСС И ИСТОРИЯ РАЗБОРОВ ---
    function renderProgressTab() {
      const totalTasks = appState.history.length;
      const avgScore = totalTasks > 0
        ? (appState.history.reduce((acc, item) => acc + Number(item.score || 0), 0) / totalTasks).toFixed(2)
        : '—';
      const avgPercent = totalTasks > 0
        ? Math.round((Number(avgScore) / 7) * 100)
        : 0;

      return `
        <div class="space-y-4">
          <h1 class="text-xl font-extrabold text-gray-900">Твой прогресс к B1</h1>

          <div class="grid grid-cols-3 gap-2.5">
            <div class="bg-amber-50 border border-amber-200 rounded-3xl p-3.5 text-center">
              <div class="text-2xl mb-0.5">🧱</div>
              <div class="text-xl font-extrabold text-amber-900">${appState.cegly}</div>
              <div class="text-[11px] font-medium text-amber-700">Cegieł</div>
            </div>
            <div class="bg-white border border-purple-100 rounded-3xl p-3.5 text-center card-shadow">
              <div class="text-2xl mb-0.5">🎯</div>
              <div class="text-xl font-extrabold text-brama-700">${avgScore}</div>
              <div class="text-[11px] font-medium text-gray-500">Средний (из 7)</div>
            </div>
            <div class="bg-white border border-purple-100 rounded-3xl p-3.5 text-center card-shadow">
              <div class="text-2xl mb-0.5">📊</div>
              <div class="text-xl font-extrabold text-emerald-600">${totalTasks > 0 ? avgPercent + '%' : '0%'}</div>
              <div class="text-[11px] font-medium text-gray-500">Готовность</div>
            </div>
          </div>

          <div class="bg-white rounded-3xl p-4 card-shadow border border-purple-100">
            <h2 class="text-sm font-bold text-gray-900 mb-3">История проверенных заданий</h2>
            ${totalTasks === 0 ? `
              <div class="text-center py-6 space-y-2">
                <p class="text-sm text-gray-500">Здесь появятся твои оценки и разборы.</p>
                <button onclick="switchTab('exams')" class="px-4 py-2 rounded-2xl bg-brama-600 text-white text-xs font-bold">
                  Перейти к первому заданию
                </button>
              </div>
            ` : `
              <div class="space-y-2.5">
                ${appState.history.map(item => `
                  <details class="bg-gray-50 rounded-2xl p-3 border border-gray-200/80">
                    <summary class="flex items-center justify-between cursor-pointer list-none">
                      <div>
                        <span class="text-[10px] font-bold uppercase text-brama-600">${escapeHtml(item.type)}</span>
                        <p class="text-xs font-bold text-gray-900">${escapeHtml(item.title)}</p>
                        <span class="text-[10px] text-gray-400">${item.date}</span>
                      </div>
                      <span class="text-sm font-extrabold px-2.5 py-1 rounded-xl bg-white border border-purple-100 text-brama-700">
                        ${item.score} / 7
                      </span>
                    </summary>
                    <div class="mt-3 pt-2.5 border-t border-gray-200 text-xs space-y-2">
                      <p class="text-gray-600"><strong>Твой ответ:</strong> ${escapeHtml(item.userText)}</p>
                      <p class="text-emerald-800 bg-emerald-50 p-2 rounded-xl"><strong>Образец:</strong> ${escapeHtml(item.feedback.improvedVersion)}</p>
                    </div>
                  </details>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // Утилиты экранирования HTML и JS-строк
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeJs(str) {
      if (!str) return '';
      return String(str)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/`/g, '\\`')
        .replace(/\n/g, ' ');
    }

    // Инициализация приложения
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
